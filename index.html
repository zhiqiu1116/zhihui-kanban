<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>赋能看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F0F2F5;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;color:rgba(0,0,0,0.88);font-size:14px;line-height:1.5715;min-height:100vh;-webkit-tap-highlight-color:transparent}
.num{font-family:'Barlow','Noto Sans SC','PingFang SC',sans-serif;font-variant-numeric:tabular-nums}

/* === Header Card === */
.header-card{background:linear-gradient(135deg,#0D47A1 0%,#1565C0 35%,#1890FF 100%);border-radius:6px;padding:24px 20px 18px;margin:12px;color:#fff;box-shadow:0 4px 16px rgba(13,71,161,0.25);position:relative;overflow:hidden}
.header-card::before{content:'';position:absolute;top:-40px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.06)}
.header-card::after{content:'';position:absolute;bottom:-20px;right:40px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.04)}
.header-card .header-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.header-title{display:flex;align-items:baseline;gap:6px}
.header-title h3{font-size:24px;font-weight:700;letter-spacing:2px;margin:0}
.header-card .header-row2{display:flex;align-items:center;gap:10px;margin-top:10px}
.header-card .subtitle{font-size:11px;opacity:0.6;margin-top:10px;letter-spacing:0.5px}
.level-tag{background:rgba(255,255,255,0.15);color:#fff;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px;border:0.667px solid rgba(255,255,255,0.25);backdrop-filter:blur(4px)}
.level-tag svg{vertical-align:middle;flex-shrink:0}
.date-tag{background:rgba(255,255,255,0.1);color:#fff;padding:3px 10px;border-radius:4px;font-size:12px;border:0.667px solid rgba(255,255,255,0.2);display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
.date-tag .date-text{font-size:12px;color:#fff;white-space:nowrap}
.live-dot{width:8px;height:8px;border-radius:50%;background:#52C41A;display:inline-block;animation:pulse 1.5s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.2)}}

/* === Nav Tabs === */
.nav-card{margin:0 12px 8px;background:#fff;border-radius:8px;padding:0;box-shadow:0 1px 2px 0 rgba(0,0,0,0.03),0 1px 6px -1px rgba(0,0,0,0.02),0 2px 4px 0 rgba(0,0,0,0.02);border-bottom:1px solid #F0F0F0}
.nav-tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;position:relative}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{flex:none;text-align:center;padding:12px 16px;font-size:14px;color:rgba(0,0,0,0.65);cursor:pointer;transition:all 0.3s;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;border-bottom:2px solid transparent}
.nav-tab.active{background:rgba(24,144,255,0.08);color:#1890FF;font-weight:600;border-bottom:2px solid #1890FF}
.nav-tab .tab-count{background:#F0F0F0;color:#999;font-size:11px;padding:1px 6px;border-radius:10px;font-weight:500}
.nav-tab.active .tab-count{background:rgba(24,144,255,0.15);color:#1890FF}
.nav-tab svg{width:16px;height:16px;flex-shrink:0}
.nav-tab[data-tab="community"] svg{width:13px;height:13px}
.nav-tab[data-tab="mgr"] svg{width:18px;height:18px}

/* === Tab Panel === */
.tab-panel{display:none}
.tab-panel.active{display:block}

/* === Role Summary Card === */
.summary-card{margin:0 12px 8px;background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 2px 0 rgba(0,0,0,0.03),0 1px 6px -1px rgba(0,0,0,0.02),0 2px 4px 0 rgba(0,0,0,0.02)}
.summary-title{font-size:14px;font-weight:600;color:#333;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.summary-title::before{content:'';width:3px;height:14px;background:#1890FF;border-radius:2px;flex-shrink:0}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.summary-item{background:#FAFAFA;border:1px solid #F0F0F0;border-radius:6px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.summary-item-label{font-size:12px;color:rgba(0,0,0,0.45);white-space:nowrap}
.summary-item-value{font-size:18px;font-weight:600;font-family:'Barlow','Noto Sans SC',sans-serif;font-variant-numeric:tabular-nums;line-height:1}
.summary-item-value.blue{color:#1890FF}
.summary-item-value.green{color:#389E0D}
.summary-item-value.orange{color:#D48806}
.summary-item-value.red{color:#CF132C}

/* === Person Card === */
.person-card{margin:0 12px 8px;background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 2px 0 rgba(0,0,0,0.03),0 1px 6px -1px rgba(0,0,0,0.02),0 2px 4px 0 rgba(0,0,0,0.02)}
.person-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#fff;flex-shrink:0}
.avatar.blue{background:linear-gradient(135deg,#1890FF,#096DB9)}
.avatar.green{background:linear-gradient(135deg,#52C41A,#389E0D)}
.avatar.orange{background:linear-gradient(135deg,#FA8C16,#D48806)}
.avatar.purple{background:linear-gradient(135deg,#722ED1,#531DAB)}
.person-name{font-size:15px;font-weight:600;color:#333}
.person-meta{font-size:12px;color:#999;margin-top:2px}
.person-status{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12px}
.status-tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.status-active{background:#F6FFED;color:#389E0D;border:1px solid #B7EB8F}
.status-warn{background:#FFF7E6;color:#D48806;border:1px solid #FFD591}
.status-risk{background:#FFF1F0;color:#CF132C;border:1px solid #FFA39E}

/* === Metric Row === */
.metric-section-title{font-size:12px;font-weight:600;color:#999;margin-bottom:10px;display:flex;align-items:center;gap:4px}
.metric-section-title::before{content:'';width:2px;height:12px;background:#1890FF;opacity:0.4;border-radius:1px}
.metric-list{display:flex;flex-direction:column;gap:12px}
.metric-item{display:flex;align-items:center;gap:10px}
.metric-label{font-size:13px;color:#333;width:70px;flex-shrink:0;text-align:right}
.metric-bar-wrap{flex:1;height:20px;background:#F5F5F5;border-radius:10px;overflow:hidden;position:relative}
.metric-bar{height:100%;border-radius:10px;transition:width 0.8s ease;position:relative;min-width:4px}
.metric-bar.over{background:linear-gradient(90deg,#389E0D,#52C41A)}
.metric-bar.green{background:linear-gradient(90deg,#52C41A,#73D13D)}
.metric-bar.blue{background:linear-gradient(90deg,#1890FF,#40A9FF)}
.metric-bar.orange{background:linear-gradient(90deg,#D48806,#FA8C16)}
.metric-bar.red{background:linear-gradient(90deg,#CF132C,#F5222D)}
.metric-bar.info{background:#E8F0FE}
.metric-bar-wrap.zero-alert{background:#FFE0E0}
.metric-bar-text{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:#333;white-space:nowrap;padding-right:8px;pointer-events:none;-webkit-text-stroke:0.5px #fff;paint-order:stroke fill}
.metric-bar-text.zero{color:#CF132C;-webkit-text-stroke:0.5px #FFE}
.metric-bar-center{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:#1890FF;white-space:nowrap;padding-right:8px;pointer-events:none}
.metric-bar-center.zero{color:#CF132C}

/* === Todo Order Row === */
.todo-section-title{font-size:12px;font-weight:600;color:#8C6D1F;margin:16px 0 10px;display:flex;align-items:center;gap:4px}
.todo-section-title::before{content:'';width:2px;height:12px;background:#D48806;opacity:0.5;border-radius:1px}
.todo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.todo-item{display:flex;align-items:center;gap:6px}
.todo-badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;font-family:'Barlow','Noto Sans SC',sans-serif;font-variant-numeric:tabular-nums;background:#FFF7E6;color:#D48806;border:1px solid #FFD591;white-space:nowrap}
.todo-badge .todo-label{font-size:12px;color:#8C6D1F;font-weight:500}
.todo-badge .todo-num{font-weight:700;font-size:13px;color:#D48806}
.todo-badge .todo-unit{font-size:10px;color:#999;font-weight:400}
.todo-badge.zero{background:#F5F5F5;border-color:#E8E8E8}
.todo-badge.zero .todo-label,.todo-badge.zero .todo-num,.todo-badge.zero .todo-unit{color:#BFBFBF}
.todo-badge.urgent{background:#FFF1F0;border-color:#FFA39E;animation:todoPulse 2s ease-in-out infinite}
.todo-badge.urgent .todo-label,.todo-badge.urgent .todo-num{color:#CF132C}
@keyframes todoPulse{0%,100%{opacity:1}50%{opacity:0.7}}

/* === Overall Score === */
.overall-score{display:flex;align-items:center;gap:16px;padding:12px;background:linear-gradient(135deg,rgba(24,144,255,0.05),rgba(24,144,255,0.02));border:1px solid #91D5FF;border-radius:8px;margin-bottom:14px}
.score-ring{width:56px;height:56px;flex-shrink:0}
.score-info{flex:1}
.score-label{font-size:12px;color:#999}
.score-value{font-size:22px;font-weight:700;font-family:'Barlow','Noto Sans SC',sans-serif;color:#1890FF;line-height:1.2;margin-top:2px}
.score-rank{font-size:12px;color:#666;margin-top:2px}
.score-rank .highlight{color:#1890FF;font-weight:600}

/* === Empty === */
.empty-state{text-align:center;padding:40px 20px;color:#bbb;font-size:13px}

/* === Responsive === */
@media(min-width:769px){
  .header-card{padding:20px 32px}
  .nav-card{margin:0 24px 12px}
  .summary-card,.person-card{margin:0 24px 8px;padding:20px 24px}
  .nav-tab{padding:12px 24px}
}
@media(min-width:1200px){
  .header-card{padding:24px 40px;margin:16px 24px}
  .nav-card{margin:0 24px 12px}
  .summary-card,.person-card{margin:0 24px 12px;padding:24px}
}
@media(max-width:768px){
  .header-card{padding:16px 12px 14px}
  .header-title h3{font-size:20px;letter-spacing:1px}
  .nav-card{margin:0 8px 8px}
  .nav-tab{padding:8px 12px;font-size:13px}
  .summary-card,.person-card{margin:0 8px 8px;padding:12px}
  .summary-grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .summary-item{padding:8px 10px}
  .summary-item-value{font-size:16px}
  .metric-label{font-size:12px;width:60px}
  .metric-bar-wrap{height:18px}
  .person-header{margin-bottom:10px}
  .avatar{width:36px;height:36px;font-size:14px}
}
@media(max-width:480px){
  .header-card{padding:12px 10px 10px;margin:6px}
  .header-title h3{font-size:17px;letter-spacing:1px}
  .nav-card{margin:0 6px 6px}
  .nav-tab{padding:6px 8px;font-size:12px}
  .summary-card,.person-card{margin:0 6px 6px;padding:10px}
  .summary-grid{grid-template-columns:repeat(2,1fr);gap:4px}
  .summary-item{padding:6px 8px}
  .summary-item-value{font-size:14px}
  .summary-item-label{font-size:11px}
  .metric-label{font-size:11px;width:52px}
  .metric-bar-wrap{height:16px}
  .metric-bar-text{font-size:9px;padding-right:4px}
  .metric-bar-center{font-size:10px;padding-right:4px}
  .ring-svg{width:54px;height:54px}
  .ring-label{font-size:10px}
  .score-value{font-size:18px}
  .person-name{font-size:14px}
  .avatar{width:32px;height:32px;font-size:13px}
}
</style>
</head>

// ====== Helpers ======
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}

function getColor(pct){
  if(pct>=100) return 'over';
  if(pct>=75) return 'green';
  if(pct>=50) return 'blue';
  if(pct>=30) return 'orange';
  return 'red';
}

function getStatusTag(status){
  if(status==='active') return '<span class="status-tag status-active">表现良好</span>';
  if(status==='warn') return '<span class="status-tag status-warn">需关注</span>';
  if(status==='risk') return '<span class="status-tag status-risk">需帮扶</span>';
  return '';
}

// ====== Rendering ======
function renderSummary(role){
  var data = PERSONNEL[role];
  var metrics = ROLES[role].metrics;
  var n = data.length;
  var totals = {};
  metrics.forEach(function(m){totals[m.key]={sum:0,target:0}});

  data.forEach(function(p){
    metrics.forEach(function(m){
      totals[m.key].sum += p.metrics[m.key];
      totals[m.key].target += m.target;
    });
  });

  var avgRate = 0, cnt = 0;
  Object.keys(totals).forEach(function(k){
    var m = metrics.find(function(x){return x.key===k});
    if(m && m.target > 0 && totals[k].target > 0){
      avgRate += totals[k].sum / totals[k].target;
      cnt++;
    }
  });
  avgRate = cnt > 0 ? Math.round(avgRate / cnt * 100) : -1;

  var html = '<div class="summary-card">';
  html += '<div class="summary-title">' + ROLES[role].label + '团队概览</div>';
  html += '<div class="summary-grid">';

  // 总体完成率
  if(avgRate >= 0){
    var avgColor = getColor(avgRate);
    html += '<div class="summary-item"><span class="summary-item-label">总体完成率</span><span class="summary-item-value ' + avgColor + '">' + avgRate + '%</span></div>';
  }
  html += '<div class="summary-item"><span class="summary-item-label">在岗人数</span><span class="summary-item-value blue">' + n + '人</span></div>';

  // 每个指标的汇总
  metrics.forEach(function(m){
    var avg = n > 0 ? (totals[m.key].sum / n).toFixed(0) : 0;
    if(m.target > 0){
      var avgPct = totals[m.key].target > 0 ? Math.round((totals[m.key].sum / totals[m.key].target) * 100) : 0;
      var c = getColor(avgPct);
      html += '<div class="summary-item"><span class="summary-item-label">人均' + m.label + '</span><span class="summary-item-value ' + c + '">' + avg + m.unit + '</span></div>';
    } else {
      html += '<div class="summary-item"><span class="summary-item-label">人均' + m.label + '</span><span class="summary-item-value" style="color:#333">' + avg + m.unit + '</span></div>';
    }
  });

  html += '</div></div>';

  // Todo summary - hidden
  /*
  var todoItems = ROLES[role].todos || [];
  if(todoItems.length > 0){
    html += '<div class="summary-card">';
    html += '<div class="summary-title">待办工单</div>';
    html += '<div class="summary-grid">';
    todoItems.forEach(function(t){
      var total = 0;
      data.forEach(function(p){ total += (p.todos ? (p.todos[t.key] || 0) : 0); });
      var cls = total === 0 ? ' zero' : (total >= 10 ? ' red' : ' orange');
      html += '<div class="summary-item"><span class="summary-item-label">' + t.label + '</span><span class="summary-item-value ' + cls + '">' + total + t.unit + '</span></div>';
    });
    html += '</div></div>';
  }
  */

  return html;
}

function renderPerson(person, role, index){
  var metrics = ROLES[role].metrics;
  var colorClass = person.color || 'blue';

  // 计算个人总体完成率（仅计有目标的指标）
  var totalPct = 0, cnt = 0;
  metrics.forEach(function(m){
    if(m.target > 0){
      var pct = Math.min(person.metrics[m.key] / m.target * 100, 150);
      totalPct += pct;
      cnt++;
    }
  });
  totalPct = cnt > 0 ? Math.round(totalPct / cnt) : -1;
  var scoreColor = getColor(totalPct);

  var html = '<div class="person-card">';
  // Person Header
  html += '<div class="person-header">';
  html += '<div class="avatar ' + colorClass + '">' + person.name.charAt(0) + '</div>';
  html += '<div><div class="person-name">' + person.name + '</div>';
  html += '<div class="person-meta">' + ROLES[role].label + ' · No.' + (index+1) + '</div></div>';
  html += '<div class="person-status">' + getStatusTag(person.status) + '</div>';
  html += '</div>';

  // Overall Score (only if has target metrics)
  if(totalPct >= 0){
    var scoreColor = getColor(totalPct);
    html += '<div class="overall-score">';
    html += renderScoreRing(totalPct, scoreColor);
    html += '<div class="score-info"><div class="score-label">综合完成率</div>';
    html += '<div class="score-value">' + totalPct + '%</div>';
    var rank = index + 1;
    html += '<div class="score-rank">团队排名 <span class="highlight">第' + rank + '名</span> / 共' + PERSONNEL[role].length + '人</div>';
    html += '</div></div>';
  }

  // Work Productivity Metrics
  html += '<div class="metric-section-title">工作产能</div>';
  html += '<div class="metric-list">';
  metrics.forEach(function(m){
    var val = person.metrics[m.key];
    html += '<div class="metric-item">';
    html += '<div class="metric-label">' + m.label + '</div>';
    var zeroAlertClass = (val === 0) ? ' zero-alert' : '';
    html += '<div class="metric-bar-wrap' + zeroAlertClass + '">';
    if(m.target > 0){
      // 有固定目标：进度条按完成率填充+颜色
      var pct = Math.min(val / m.target * 100, 150);
      var barColor = getColor(pct);
      var barWidth = Math.min(pct, 100);
      html += '<div class="metric-bar ' + barColor + '" style="width:' + barWidth + '%"></div>';
      html += '<span class="metric-bar-text' + (val === 0 ? ' zero' : '') + '">(' + Math.round(pct) + '%) ' + val + '/' + m.target + m.unit + '</span>';
    } else {
      // 无固定目标：浅色满条
      var zeroClass = val === 0 ? ' zero' : '';
      html += '<div class="metric-bar info" style="width:100%"></div>';
      html += '<span class="metric-bar-center' + zeroClass + '">' + val + m.unit + '</span>';
    }
    html += '</div></div>';
  });
  html += '</div>';

  // Todo Orders
  var todoItems = ROLES[role].todos || [];
  if(todoItems.length > 0){
    html += '<div class="todo-section-title">待办工单</div>';
    html += '<div class="todo-row">';
    todoItems.forEach(function(t){
      var val = person.todos ? (person.todos[t.key] || 0) : 0;
      var cls = val === 0 ? ' zero' : (val >= 5 ? ' urgent' : '');
      html += '<span class="todo-badge' + cls + '">';
      html += '<span class="todo-label">' + t.label + '</span>';
      html += '<span class="todo-num">' + val + '</span>';
      html += '<span class="todo-unit">' + t.unit + '</span>';
      html += '</span>';
    });
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function renderScoreRing(pct, colorClass){
  var r = 22, c = 2 * Math.PI * r;
  var offset = c * (1 - Math.min(pct,100) / 100);
  var strokeColor = pct >= 100 ? '#389E0D' : (pct >= 75 ? '#52C41A' : (pct >= 50 ? '#1890FF' : (pct >= 30 ? '#D48806' : '#CF132C')));
  return '<svg class="score-ring" viewBox="0 0 56 56">' +
    '<circle cx="28" cy="28" r="22" stroke="#F0F0F0" stroke-width="5" fill="none"/>' +
    '<circle cx="28" cy="28" r="22" stroke="' + strokeColor + '" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" transform="rotate(-90 28 28)"/>' +
    '<text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="' + strokeColor + '" font-family="Barlow,sans-serif">' + pct + '%</text>' +
    '</svg>';
}

function renderPanel(role){
  var html = renderSummary(role);
  PERSONNEL[role].forEach(function(p, idx){
    html += renderPerson(p, role, idx);
  });
  return html;
}

// ====== Init ======
function init(){
  document.getElementById('panel-mgr').innerHTML = renderPanel('manager');
  document.getElementById('panel-community').innerHTML = renderPanel('community');
  document.getElementById('panel-clerk').innerHTML = renderPanel('clerk');
  document.getElementById('panel-specialist').innerHTML = renderPanel('specialist');

  // Update counts
  document.getElementById('count-mgr').textContent = PERSONNEL.manager.length;
  document.getElementById('count-community').textContent = PERSONNEL.community.length;
  document.getElementById('count-clerk').textContent = PERSONNEL.clerk.length;
  document.getElementById('count-specialist').textContent = PERSONNEL.specialist.length;

  // Tab switching
  var tabs = document.querySelectorAll('.nav-tab');
  var panels = document.querySelectorAll('.tab-panel');
  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      tabs.forEach(function(t){t.classList.remove('active')});
      tab.classList.add('active');
      panels.forEach(function(p){p.classList.remove('active')});
      var panelId = 'panel-' + tab.dataset.tab;
      document.getElementById(panelId).classList.add('active');
    });
  });
}

init();
